<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe with Leaderboard</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .game-area {
            text-align: center;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 5px;
            background-color: #333;
            margin: 20px auto;
        }
        .cell {
            background-color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .cell:hover { background-color: #eee; }
        .status {
            margin-top: 15px;
            font-size: 1.2rem;
            font-weight: bold;
        }
        button {
            padding: 8px 16px;
            font-size: 1rem;
            margin-top: 10px;
            cursor: pointer;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
        }
        button:hover { background: #0056b3; }
        .leaderboard {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 16px;
            min-width: 200px;
        }
        .leaderboard h3 { margin-top: 0; }
        .leaderboard ol { padding-left: 20px; }
        .leaderboard li { margin: 8px 0; }
        input {
            padding: 8px;
            font-size: 1rem;
            margin-right: 8px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="game-area">
        <h2>Tic-Tac-Toe</h2>
        <div>
            <input type="text" id="playerName" placeholder="Your name" value="Bini">
            <button id="resetBtn">New Game</button>
        </div>
        <div class="board" id="board">
            <!-- 9 cells will be generated by JS -->
        </div>
        <div class="status" id="status">Your turn (X)</div>
    </div>
    <div class="leaderboard">
        <h3>🏆 Leaderboard</h3>
        <ol id="leaderboardList">
            <li>Loading...</li>
        </ol>
        <button id="refreshLeaderboard">Refresh</button>
    </div>
</div>

<script>
    // Game state
    let board = ['', '', '', '', '', '', '', '', ''];
    let currentPlayer = 'X';   // X is human, O is computer
    let gameActive = true;
    let playerName = '';

    const winPatterns = [
        [0,1,2], [3,4,5], [6,7,8],
        [0,3,6], [1,4,7], [2,5,8],
        [0,4,8], [2,4,6]
    ];

    const boardElement = document.getElementById('board');
    const statusDiv = document.getElementById('status');
    const resetBtn = document.getElementById('resetBtn');
    const playerNameInput = document.getElementById('playerName');
    const leaderboardList = document.getElementById('leaderboardList');
    const refreshLeaderboardBtn = document.getElementById('refreshLeaderboard');

    // Draw board UI
    function renderBoard() {
        boardElement.innerHTML = '';
        for (let i = 0; i < 9; i++) {
            const cell = document.createElement('div');
            cell.classList.add('cell');
            cell.textContent = board[i];
            cell.addEventListener('click', () => handleCellClick(i));
            boardElement.appendChild(cell);
        }
    }

    function checkWinner() {
        for (let pattern of winPatterns) {
            const [a,b,c] = pattern;
            if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                return board[a];
            }
        }
        return board.includes('') ? null : 'draw';
    }

    async function handleCellClick(index) {
        if (!gameActive) return;
        if (board[index] !== '') return;
        if (currentPlayer !== 'X') return;

        board[index] = 'X';
        renderBoard();
        let winner = checkWinner();
        if (winner) {
            endGame(winner);
            return;
        }
        currentPlayer = 'O';
        statusDiv.textContent = "Computer's turn (O)...";
        setTimeout(computerMove, 300);
    }

    function computerMove() {
        if (!gameActive) return;
        if (currentPlayer !== 'O') return;

        let emptyIndices = board.reduce((arr, cell, idx) => {
            if (cell === '') arr.push(idx);
            return arr;
        }, []);
        if (emptyIndices.length === 0) return;
        let randomIndex = emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
        board[randomIndex] = 'O';
        renderBoard();
        let winner = checkWinner();
        if (winner) {
            endGame(winner);
            return;
        }
        currentPlayer = 'X';
        statusDiv.textContent = "Your turn (X)";
    }

    async function endGame(winner) {
        gameActive = false;
        let winnerText = '';
        if (winner === 'X') {
            winnerText = playerName;
            statusDiv.textContent = `🎉 ${playerName} wins! 🎉`;
        } else if (winner === 'O') {
            winnerText = 'Computer';
            statusDiv.textContent = `💀 Computer wins! 💀`;
        } else {
            winnerText = 'draw';
            statusDiv.textContent = `It's a draw!`;
        }
        await saveGameResult(winnerText);
        await loadLeaderboard();
    }

    async function saveGameResult(winner) {
        try {
            const response = await fetch('/api/save_result', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    player_name: playerName,
                    winner: winner
                })
            });
            if (!response.ok) throw new Error('Failed to save');
        } catch (err) {
            console.error('Error saving game:', err);
        }
    }

    async function loadLeaderboard() {
        try {
            const res = await fetch('/api/leaderboard');
            const data = await res.json();
            if (data.length === 0) {
                leaderboardList.innerHTML = '<li>No games yet</li>';
                return;
            }
            leaderboardList.innerHTML = data.map(entry => 
                `<li><strong>${escapeHtml(entry.player_name)}</strong> - ${entry.wins} win${entry.wins !== 1 ? 's' : ''}</li>`
            ).join('');
        } catch (err) {
            console.error('Leaderboard error:', err);
            leaderboardList.innerHTML = '<li>Error loading</li>';
        }
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function resetGame() {
        board = ['', '', '', '', '', '', '', '', ''];
        currentPlayer = 'X';
        gameActive = true;
        statusDiv.textContent = "Your turn (X)";
        renderBoard();
    }

    resetBtn.addEventListener('click', () => {
        resetGame();
    });

    refreshLeaderboardBtn.addEventListener('click', loadLeaderboard);

    function init() {
        playerName = playerNameInput.value.trim() || "Bini";
        playerNameInput.addEventListener('change', () => {
            playerName = playerNameInput.value.trim() || "Bini";
        });
        resetGame();
        loadLeaderboard();
    }

    init();
</script>
</body>
</html>
